name: 'Setup Build Environment'
description: 'Setup Node.js, install dependencies, and download binaries'
inputs:
  download-binaries:
    description: 'Whether to download binaries artifact'
    required: false
    default: 'true'
runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci
      shell: bash

    - name: Download binaries
      if: inputs.download-binaries == 'true'
      uses: actions/download-artifact@v4
      with:
        name: haystack-binaries
        path: binaries
