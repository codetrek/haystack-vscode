name: 'Build Extension Package'
description: 'Build VS Code extension package with specified binaries'
inputs:
  extension-version:
    description: 'Extension version'
    required: true
  platform:
    description: 'Platform for naming (optional, for platform-specific builds)'
    required: false
    default: ''
  package-type:
    description: 'Package type: platform-specific or all-in-one'
    required: true
  haystack-version:
    description: 'Haystack version'
    required: true
outputs:
  package-name:
    description: 'Name of the generated package'
    value: ${{ steps.build.outputs.package-name }}
runs:
  using: 'composite'
  steps:
    - name: Clean up any existing VSIX files
      run: |
        echo "Cleaning up any existing VSIX files..."
        rm -f *.vsix
        echo "Cleanup completed"
      shell: bash

    - name: Prepare binaries
      id: prepare
      run: |
        HAYSTACK_VERSION="${{ inputs.haystack-version }}"
        PLATFORM="${{ inputs.platform }}"
        PACKAGE_TYPE="${{ inputs.package-type }}"

        mkdir -p pkgs

        if [[ "$PACKAGE_TYPE" == "platform-specific" ]]; then
          FILENAME="haystack-${PLATFORM}-v${HAYSTACK_VERSION}.zip"
          cp "binaries/$FILENAME" "pkgs/$FILENAME"
          echo "Prepared binary for platform $PLATFORM: pkgs/$FILENAME"
        else
          cp binaries/* pkgs/
          echo "All binaries prepared:"
          ls -la pkgs/
        fi
      shell: bash

    - name: Build extension package
      id: build
      run: |
        EXTENSION_VERSION="${{ inputs.extension-version }}"
        PLATFORM="${{ inputs.platform }}"
        PACKAGE_TYPE="${{ inputs.package-type }}"

        echo "Building $PACKAGE_TYPE extension package..."

        # Build the extension package
        npm run build:prod

        # Create the VSIX package with appropriate naming and targets
        if [[ "$PACKAGE_TYPE" == "platform-specific" ]]; then
          # Map binary platform names to vsce target names
          case "$PLATFORM" in
            "darwin-amd64")
              VSCE_TARGET="darwin-x64"
              ;;
            "darwin-arm64")
              VSCE_TARGET="darwin-arm64"
              ;;
            "linux-amd64")
              VSCE_TARGET="linux-x64"
              ;;
            "linux-arm64")
              VSCE_TARGET="linux-arm64"
              ;;
            "windows-amd64")
              VSCE_TARGET="win32-x64"
              ;;
            "windows-arm64")
              VSCE_TARGET="win32-arm64"
              ;;
            *)
              echo "Error: Unknown platform $PLATFORM"
              exit 1
              ;;
          esac

          echo "Building for platform: $PLATFORM -> vsce target: $VSCE_TARGET"
          npx vsce package --no-dependencies --target "$VSCE_TARGET"
          
          # vsce package --target generates: haystack-search-<target>-<version>.vsix
          PACKAGE_NAME="haystack-search-${VSCE_TARGET}-${EXTENSION_VERSION}.vsix"
          
          if [[ ! -f "$PACKAGE_NAME" ]]; then
            echo "Error: Expected package file not found: $PACKAGE_NAME"
            echo "Available files:"
            ls -la *.vsix || echo "No .vsix files found"
            exit 1
          fi
        else
          # All-in-one package uses default naming
          PACKAGE_NAME="haystack-search-${EXTENSION_VERSION}.vsix"
          npx vsce package --no-dependencies -o "$PACKAGE_NAME"
        fi

        echo "Package created: $PACKAGE_NAME"
        echo "package-name=$PACKAGE_NAME" >> $GITHUB_OUTPUT
      shell: bash
