name: Release

on:
  workflow_dispatch:
    inputs:
      force_recreate:
        description: 'Force recreation of the release'
        required: false
        default: 'false'
        type: boolean

# Permissions needed for creating tags and releases
permissions:
  contents: write
  packages: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.package-info.outputs.version }}
      haystackVersion: ${{ steps.package-info.outputs.haystackVersion }}
      should_release: ${{ steps.check-tag.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract package info
        id: package-info
        run: |
          version=$(node -p "require('./package.json').version")
          haystackVersion=$(node -p "require('./package.json').haystackVersion")
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "haystackVersion=$haystackVersion" >> $GITHUB_OUTPUT
          echo "Version: $version, Haystack Version: $haystackVersion"

      - name: Check if tag exists
        id: check-tag
        run: |
          tag_exists=$(git ls-remote --tags origin refs/tags/v${{ steps.package-info.outputs.version }} | wc -l)
          if [[ $tag_exists -gt 0 && "${{ github.event.inputs.force_recreate }}" != "true" ]]; then
            echo "Tag v${{ steps.package-info.outputs.version }} already exists, skipping release"
            echo "should_release=false" >> $GITHUB_OUTPUT
          else
            echo "Creating release for v${{ steps.package-info.outputs.version }}"
            echo "should_release=true" >> $GITHUB_OUTPUT
          fi

  download-binaries:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Verify access to Haystack repository
        run: |
          echo "Checking access to ai-microsoft/haystack repository..."
          gh repo view ai-microsoft/haystack --json name,visibility
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all Haystack binaries
        run: |
          HAYSTACK_VERSION=${{ needs.prepare.outputs.haystackVersion }}

          echo "Downloading all Haystack binaries for version: v${HAYSTACK_VERSION}"

          # Check if the release exists first
          if ! gh release view "v${HAYSTACK_VERSION}" --repo "ai-microsoft/haystack" >/dev/null 2>&1; then
            echo "Error: Release v${HAYSTACK_VERSION} not found in ai-microsoft/haystack"
            exit 1
          fi

          # Create directory
          mkdir -p binaries

          # Download all platform binaries
          for PLATFORM in darwin-amd64 darwin-arm64 linux-amd64 linux-arm64 windows-amd64 windows-arm64; do
            FILENAME="haystack-${PLATFORM}-v${HAYSTACK_VERSION}.zip"
            echo "Downloading: $FILENAME"
            
            gh release download "v${HAYSTACK_VERSION}" \
              --repo "ai-microsoft/haystack" \
              --pattern "$FILENAME" \
              --dir "binaries"
            
            # Verify the file was downloaded
            if [[ ! -f "binaries/$FILENAME" ]]; then
              echo "Error: Failed to download $FILENAME"
              exit 1
            fi
          done

          echo "All binaries downloaded successfully:"
          ls -la binaries/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload binaries as artifact
        uses: actions/upload-artifact@v4
        with:
          name: haystack-binaries
          path: binaries/
          retention-days: 1

  build-platform-specific:
    needs: [prepare, download-binaries]
    if: needs.prepare.outputs.should_release == 'true'
    strategy:
      matrix:
        platform:
          [darwin-amd64, darwin-arm64, linux-amd64, linux-arm64, windows-amd64, windows-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup build environment
        uses: ./.github/actions/setup-build-env

      - name: Build platform-specific extension
        id: build-platform
        uses: ./.github/actions/build-extension
        with:
          extension-version: ${{ needs.prepare.outputs.version }}
          platform: ${{ matrix.platform }}
          package-type: platform-specific
          haystack-version: ${{ needs.prepare.outputs.haystackVersion }}

      - name: Upload platform-specific VSIX as artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.platform }}
          path: ${{ steps.build-platform.outputs.package-name }}
          retention-days: 1

  build-all-in-one:
    needs: [prepare, download-binaries]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup build environment
        uses: ./.github/actions/setup-build-env

      - name: Build all-in-one extension
        id: build-all-in-one
        uses: ./.github/actions/build-extension
        with:
          extension-version: ${{ needs.prepare.outputs.version }}
          package-type: all-in-one
          haystack-version: ${{ needs.prepare.outputs.haystackVersion }}

      - name: Upload all-in-one VSIX as artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix-all-in-one
          path: ${{ steps.build-all-in-one.outputs.package-name }}
          retention-days: 1

  create-release:
    needs: [prepare, build-platform-specific, build-all-in-one]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: vsix-*
          merge-multiple: true
          path: dist

      - name: Extract changelog
        id: changelog
        run: |
          VERSION=${{ needs.prepare.outputs.version }}
          CHANGELOG=$(sed -n "/## \[${VERSION}\]/,/## \[/p" CHANGELOG.md | sed '1d;$d')
          echo "CHANGELOG<<EOF" >> $GITHUB_ENV
          echo "$CHANGELOG" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create release tag
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git tag -a "v${{ needs.prepare.outputs.version }}" -m "Release v${{ needs.prepare.outputs.version }}"
          git push origin "v${{ needs.prepare.outputs.version }}"

      - name: Get previous version
        id: prev-version
        run: |
          # Get the latest tag before current version
          CURRENT_VERSION="v${{ needs.prepare.outputs.version }}"
          PREV_VERSION=$(git tag -l "v*" | grep -v "$CURRENT_VERSION" | sort -V | tail -1)
          echo "prev_version=$PREV_VERSION" >> $GITHUB_OUTPUT
          echo "Previous version: $PREV_VERSION"

      - name: Create release notes
        run: |
          CURRENT_VERSION="v${{ needs.prepare.outputs.version }}"
          PREV_VERSION="${{ steps.prev-version.outputs.prev_version }}"

          # Get the repository name from GitHub context
          REPO_NAME="${{ github.repository }}"

          cat > release_notes.md << EOF
          ## What's Changed

          ${{ env.CHANGELOG }}

          ## Full Changelog
          [$PREV_VERSION...$CURRENT_VERSION](https://github.com/${REPO_NAME}/compare/$PREV_VERSION...$CURRENT_VERSION)
          EOF

      - name: Create and upload to GitHub Release
        run: |
          # Create the release with custom notes
          gh release create "v${{ needs.prepare.outputs.version }}" \
            --title "v${{ needs.prepare.outputs.version }}" \
            --notes-file release_notes.md

          # Upload artifacts
          gh release upload "v${{ needs.prepare.outputs.version }}" dist/*.vsix --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
