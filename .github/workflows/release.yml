name: Release

on:
  workflow_dispatch:
    inputs:
      force_recreate:
        description: 'Force recreation of the release'
        required: false
        default: 'false'
        type: boolean

# Permissions needed for creating tags and releases
permissions:
  contents: write
  packages: read
  pull-requests: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.package-info.outputs.version }}
      haystackVersion: ${{ steps.package-info.outputs.haystackVersion }}
      should_release: ${{ steps.check-tag.outputs.should_release }}
      current_branch: ${{ steps.branch-info.outputs.current_branch }}
      is_main_branch: ${{ steps.branch-info.outputs.is_main_branch }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract package info
        id: package-info
        run: |
          version=$(node -p "require('./package.json').version")
          haystackVersion=$(node -p "require('./package.json').haystackVersion")
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "haystackVersion=$haystackVersion" >> $GITHUB_OUTPUT
          echo "Version: $version, Haystack Version: $haystackVersion"

      - name: Get branch information
        id: branch-info
        run: |
          current_branch="${GITHUB_REF#refs/heads/}"
          echo "current_branch=$current_branch" >> $GITHUB_OUTPUT
          if [[ "$current_branch" == "main" ]]; then
            echo "is_main_branch=true" >> $GITHUB_OUTPUT
          else
            echo "is_main_branch=false" >> $GITHUB_OUTPUT
          fi
          echo "Current branch: $current_branch"

      - name: Check if tag exists
        id: check-tag
        run: |
          tag_exists=$(git ls-remote --tags origin refs/tags/v${{ steps.package-info.outputs.version }} | wc -l)
          if [[ $tag_exists -gt 0 && "${{ github.event.inputs.force_recreate }}" != "true" ]]; then
            echo "::error::Tag v${{ steps.package-info.outputs.version }} already exists! Use force_recreate=true to override."
            exit 1
          else
            echo "Creating release for v${{ steps.package-info.outputs.version }}"
            echo "should_release=true" >> $GITHUB_OUTPUT
          fi

  download-binaries:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            haystack
            ${{ github.event.repository.name }}

      - name: Verify access to Haystack repository
        run: |
          echo "Checking access to ai-microsoft/haystack repository..."
          gh repo view ai-microsoft/haystack --json name,visibility
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Download all Haystack binaries
        run: |
          HAYSTACK_VERSION=${{ needs.prepare.outputs.haystackVersion }}

          echo "Downloading all Haystack binaries for version: v${HAYSTACK_VERSION}"

          # Check if the release exists first
          if ! gh release view "v${HAYSTACK_VERSION}" --repo "ai-microsoft/haystack" >/dev/null 2>&1; then
            echo "Error: Release v${HAYSTACK_VERSION} not found in ai-microsoft/haystack"
            exit 1
          fi

          # Create directory
          mkdir -p binaries

          # Download all platform binaries
          for PLATFORM in darwin-amd64 darwin-arm64 linux-amd64 linux-arm64 windows-amd64 windows-arm64; do
            FILENAME="haystack-${PLATFORM}-v${HAYSTACK_VERSION}.zip"
            echo "Downloading: $FILENAME"
            
            gh release download "v${HAYSTACK_VERSION}" \
              --repo "ai-microsoft/haystack" \
              --pattern "$FILENAME" \
              --dir "binaries"
            
            # Verify the file was downloaded
            if [[ ! -f "binaries/$FILENAME" ]]; then
              echo "Error: Failed to download $FILENAME"
              exit 1
            fi
          done

          echo "All binaries downloaded successfully:"
          ls -la binaries/
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Upload binaries as artifact
        uses: actions/upload-artifact@v4
        with:
          name: haystack-binaries
          path: binaries/
          retention-days: 1

  build-platform-specific:
    needs: [prepare, download-binaries]
    if: needs.prepare.outputs.should_release == 'true'
    strategy:
      matrix:
        platform:
          [darwin-amd64, darwin-arm64, linux-amd64, linux-arm64, windows-amd64, windows-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup build environment
        uses: ./.github/actions/setup-build-env

      - name: Build platform-specific extension
        id: build-platform
        uses: ./.github/actions/build-extension
        with:
          extension-version: ${{ needs.prepare.outputs.version }}
          platform: ${{ matrix.platform }}
          package-type: platform-specific
          haystack-version: ${{ needs.prepare.outputs.haystackVersion }}

      - name: Upload platform-specific VSIX as artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.platform }}
          path: ${{ steps.build-platform.outputs.package-name }}
          retention-days: 1

  build-all-in-one:
    needs: [prepare, download-binaries]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup build environment
        uses: ./.github/actions/setup-build-env

      - name: Build all-in-one extension
        id: build-all-in-one
        uses: ./.github/actions/build-extension
        with:
          extension-version: ${{ needs.prepare.outputs.version }}
          package-type: all-in-one
          haystack-version: ${{ needs.prepare.outputs.haystackVersion }}

      - name: Upload all-in-one VSIX as artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix-all-in-one
          path: ${{ steps.build-all-in-one.outputs.package-name }}
          retention-days: 1

  create-release:
    needs: [prepare, build-platform-specific, build-all-in-one]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: vsix-*
          merge-multiple: true
          path: dist

      - name: Extract changelog
        id: changelog
        run: |
          VERSION=${{ needs.prepare.outputs.version }}
          CHANGELOG=$(sed -n "/## \[${VERSION}\]/,/## \[/p" CHANGELOG.md | sed '1d;$d')
          echo "CHANGELOG<<EOF" >> $GITHUB_ENV
          echo "$CHANGELOG" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create release tag
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git tag -a "v${{ needs.prepare.outputs.version }}" -m "Release v${{ needs.prepare.outputs.version }}"
          git push origin "v${{ needs.prepare.outputs.version }}"

      - name: Get previous version
        id: prev-version
        run: |
          # Get the latest tag before current version
          CURRENT_VERSION="v${{ needs.prepare.outputs.version }}"
          PREV_VERSION=$(git tag -l "v*" | grep -v "$CURRENT_VERSION" | sort -V | tail -1)
          echo "prev_version=$PREV_VERSION" >> $GITHUB_OUTPUT
          echo "Previous version: $PREV_VERSION"

      - name: Create release notes
        run: |
          CURRENT_VERSION="v${{ needs.prepare.outputs.version }}"
          PREV_VERSION="${{ steps.prev-version.outputs.prev_version }}"

          # Get the repository name from GitHub context
          REPO_NAME="${{ github.repository }}"

          cat > release_notes.md << EOF
          ## What's Changed

          ${{ env.CHANGELOG }}

          ## Full Changelog
          [$PREV_VERSION...$CURRENT_VERSION](https://github.com/${REPO_NAME}/compare/$PREV_VERSION...$CURRENT_VERSION)
          EOF

      - name: Create and upload to GitHub Release
        run: |
          # Create the release with custom notes
          gh release create "v${{ needs.prepare.outputs.version }}" \
            --title "v${{ needs.prepare.outputs.version }}" \
            --notes-file release_notes.md

          # Upload artifacts
          gh release upload "v${{ needs.prepare.outputs.version }}" dist/*.vsix --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  create-pr-to-main:
    needs: [prepare, create-release]
    if: needs.prepare.outputs.should_release == 'true' && needs.prepare.outputs.is_main_branch == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create PR to main branch
        run: |
          CURRENT_BRANCH="${{ needs.prepare.outputs.current_branch }}"
          VERSION="v${{ needs.prepare.outputs.version }}"
          HAYSTACK_VERSION="${{ needs.prepare.outputs.haystackVersion }}"

          # Check if main branch exists
          if ! git ls-remote --heads origin main | grep -q main; then
            echo "::warning::Main branch not found, skipping PR creation"
            exit 0
          fi

          # Check if there are any differences between current branch and main
          git fetch origin main
          DIFF_COUNT=$(git rev-list --count origin/main..HEAD)

          if [[ $DIFF_COUNT -eq 0 ]]; then
            echo "::notice::No differences between $CURRENT_BRANCH and main, skipping PR creation"
            exit 0
          fi

          # Create PR title and body
          PR_TITLE="Release $VERSION: Merge $CURRENT_BRANCH to main"
          PR_BODY="This is an automated PR created after a successful release from a non-main branch."

          # Perform variable substitution
          PR_BODY="${PR_BODY//\$VERSION/$VERSION}"
          PR_BODY="${PR_BODY//\$CURRENT_BRANCH/$CURRENT_BRANCH}"
          PR_BODY="${PR_BODY//\$DIFF_COUNT/$DIFF_COUNT}"
          PR_BODY="${PR_BODY//\$HAYSTACK_VERSION/$HAYSTACK_VERSION}"

          # Create the PR
          echo "Creating PR from $CURRENT_BRANCH to main..."
          if gh pr create \
            --title "$PR_TITLE" \
            --body "$PR_BODY" \
            --base main \
            --head "$CURRENT_BRANCH" \
            --label "release,automated"; then
            echo "::notice::Successfully created PR from $CURRENT_BRANCH to main"
          else
            # If PR creation fails, check if PR already exists
            echo "PR creation failed, checking if PR already exists..."
            EXISTING_PR=$(gh pr list --head "$CURRENT_BRANCH" --base main --json number --jq '.[0].number // empty')
            
            if [[ -n "$EXISTING_PR" ]]; then
              echo "Found existing PR #$EXISTING_PR, updating it..."
              if gh pr edit "$EXISTING_PR" \
                --title "$PR_TITLE" \
                --body "$PR_BODY"; then
                echo "::notice::Successfully updated existing PR #$EXISTING_PR"
              else
                echo "::error::Failed to update existing PR #$EXISTING_PR"
                exit 1
              fi
            else
              echo "::error::Failed to create PR and no existing PR found"
              echo "::error::This might be due to insufficient permissions or other GitHub API issues"
              exit 1
            fi
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
